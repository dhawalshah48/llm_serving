[project]
name = "compserve"
version = "0.1.0"
description = "Compression-aware LLM serving: benchmarks, compression, and deployment around vLLM"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
